server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: blog-service

rag:
  ai-compute-base-url: ${AI_COMPUTE_BASE_URL:http://ai-compute-gateway.ai.svc.cluster.local:8080}
  ai-compute-token: ${AI_COMPUTE_API_TOKEN:}
  chat-model: ${RAG_CHAT_MODEL:gemini-3.8-flash-high}
  embedding-model: ${RAG_EMBEDDING_MODEL:bge-m3}
  qdrant-url: ${QDRANT_URL:http://qdrant:6333}
  qdrant-collection: ${QDRANT_COLLECTION:blog_chunks}
  embedding-dimension: ${EMBEDDING_DIMENSION:1024}
  top-k: ${RAG_TOP_K:3}
  max-context-chars: ${RAG_MAX_CONTEXT_CHARS:8000}
  max-answer-tokens: ${RAG_MAX_ANSWER_TOKENS:900}
  chat-concurrency: ${CHAT_CONCURRENCY:2}
  chat-queue-timeout-ms: ${CHAT_QUEUE_TIMEOUT_MS:30000}
  request-timeout-seconds: ${REQUEST_TIMEOUT_SECONDS:120}
  content-dir: ${BLOG_CONTENT_DIR:/app/content/posts}
  index-db-path: ${INDEX_DB_PATH:/data/blog-indexer/index-status.db}
  indexer-batch-size: ${INDEXER_BATCH_SIZE:6}
  indexer-chat-status-url: ${INDEXER_CHAT_STATUS_URL:http://blog-service.blog.svc.cluster.local:8080/internal/status}
  index-api-token: ${INDEX_API_TOKEN:}
  site-base-path: ${SITE_BASE_PATH:/}
  rate-limit-db-path: ${RATE_LIMIT_DB_PATH:/data/rate-limit.db}
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:15}
  rate-limit-per-day: ${RATE_LIMIT_PER_DAY:300}

assistant:
  max-tool-calls-per-request: ${ASSISTANT_MAX_TOOL_CALLS_PER_REQUEST:3}
  session-ttl-minutes: ${ASSISTANT_SESSION_TTL_MINUTES:120}
  session-max-messages: ${ASSISTANT_SESSION_MAX_MESSAGES:8}
  session-max-message-chars: ${ASSISTANT_SESSION_MAX_MESSAGE_CHARS:1000}
  session-max-entries: ${ASSISTANT_SESSION_MAX_ENTRIES:500}
  max-suggested-questions: ${ASSISTANT_MAX_SUGGESTED_QUESTIONS:3}

weather:
  provider: ${WEATHER_PROVIDER:open-meteo}
  open-meteo:
    base-url: ${WEATHER_OPEN_METEO_BASE_URL:https://api.open-meteo.com}
    geocoding-base-url: ${WEATHER_OPEN_METEO_GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com}
  amap:
    key: ${WEATHER_AMAP_KEY:}

publication:
  enabled: ${PUBLICATION_ENABLED:false}
  api-enabled: ${PUBLICATION_API_ENABLED:true}
  worker-enabled: ${PUBLICATION_WORKER_ENABLED:false}
  api-token: ${PUBLICATION_API_TOKEN:}
  db-path: ${PUBLICATION_DB_PATH:/data/publications.db}
  repo-uri: ${PUBLICATION_REPO_URI:git@github.com:yinshengphy/blog.git}
  branch: ${PUBLICATION_BRANCH:master}
  ssh-key-path: ${PUBLICATION_SSH_KEY_PATH:/var/run/secrets/blog-publisher/id_ed25519}
  known-hosts-path: ${PUBLICATION_KNOWN_HOSTS_PATH:/var/run/secrets/blog-publisher/known_hosts}
  author-name: ${PUBLICATION_GIT_AUTHOR_NAME:blog-publisher}
  author-email: ${PUBLICATION_GIT_AUTHOR_EMAIL:blog-publisher@yinshengphy.cn}
  worker-poll-ms: ${PUBLICATION_WORKER_POLL_MS:10000}
  max-attempts: ${PUBLICATION_MAX_ATTEMPTS:8}


management:
  endpoints:
    web:
      exposure:
        include: health,info


